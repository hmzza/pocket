name: Desktop release

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.0)
        required: true
        type: string

permissions:
  contents: write

env:
  DESKTOP_VERSION: ${{ inputs.version || format('1.0.{0}', github.run_number) }}

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Set desktop version
        shell: bash
        run: npm pkg set "version=$DESKTOP_VERSION" --workspace @pocket/desktop
      - run: npm run desktop:build:pos
      - run: npm run desktop:build:admin
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            apps/desktop/release/pos/*.exe
            apps/desktop/release/admin/*.exe
            apps/desktop/release/pos/*.yml
            apps/desktop/release/admin/*.yml
          if-no-files-found: error

  build-macos:
    name: Build macOS installers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Set desktop version
        shell: bash
        run: npm pkg set "version=$DESKTOP_VERSION" --workspace @pocket/desktop
      - run: npm run desktop:build:pos:mac
      - run: npm run desktop:build:admin:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            apps/desktop/release/pos/*.dmg
            apps/desktop/release/admin/*.dmg
            apps/desktop/release/pos/*.zip
            apps/desktop/release/admin/*.zip
            apps/desktop/release/pos/*.yml
            apps/desktop/release/admin/*.yml
          if-no-files-found: error

  build-linux:
    name: Build Linux installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Set desktop version
        shell: bash
        run: npm pkg set "version=$DESKTOP_VERSION" --workspace @pocket/desktop
      - run: npm run desktop:build:pos:linux
      - run: npm run desktop:build:admin:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            apps/desktop/release/pos/*.AppImage
            apps/desktop/release/admin/*.AppImage
            apps/desktop/release/pos/*.yml
            apps/desktop/release/admin/*.yml
          if-no-files-found: error

  publish:
    name: Publish installers
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: desktop-v${{ inputs.version || format('1.0.{0}', github.run_number) }}
          RELEASE_TITLE: Pocket Desktop ${{ inputs.version || format('1.0.{0}', github.run_number) }}
        run: |
          mapfile -t INSTALLERS < <(find release-assets -type f -print)
          if [ "${#INSTALLERS[@]}" -eq 0 ]; then
            echo "::error::No installer files were downloaded"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${INSTALLERS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${INSTALLERS[@]}" --title "$RELEASE_TITLE" --generate-notes --target "$GITHUB_SHA"
          fi
